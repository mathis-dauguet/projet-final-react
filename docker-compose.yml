services:
  app:
    build: .
    ports: ["3000:3000"]
    logging:
      driver: loki
      options:
        loki-url: "http://localhost:3100/loki/api/v1/push"
    depends_on: [loki]

  loki:
    image: grafana/loki:3.5.0
    command: -config.file=/etc/loki/local-config.yaml
    ports: ["127.0.0.1:3100:3100"]
    volumes:
      - loki-data:/loki

volumes:
  loki-data:
